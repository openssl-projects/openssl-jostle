name: "CI"

on:
  - "pull_request"
  - "push"

permissions:
  contents: "read"
  checks: write
  pull-requests: write

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-15"
          - "macos-15-intel"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Cache OpenSSL build"
        id: "cache-openssl"
        uses: "actions/cache@v6"
        with:
          path: "openssl/dist"
          key: "openssl-3.6.3-${{ runner.os }}-${{ runner.arch }}"
      - name: "Checkout openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        uses: "actions/checkout@v7"
        with:
          repository: "openssl/openssl"
          ref: "openssl-3.6.3"
          persist-credentials: false
          path: "openssl"
      - name: "Build openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        working-directory: "openssl"
        run: |
          ./config --prefix=$(pwd)/dist
          make -j
          make install_sw
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '8'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '11'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '17'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '21'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '25'
      - name: "Check Java version"
        run: |
          java -version
      - name: "Build headers"
        working-directory: "jostle"
        run: |
          ./gradlew clean compileJava
      - name: "Build and install the interface"
        working-directory: "jostle"
        env:
          JOSTLE_OPS_TEST: "true"
          OPENSSL_PREFIX: "${{ github.workspace }}/openssl/dist"
        run: |
          ./interface/build.sh
      - name: "Build jar"
        working-directory: "jostle"
        env:
          BC_JDK8: "${{ env.JAVA_HOME_8_X64 }}${{ env.JAVA_HOME_8_ARM64 }}"
          BC_JDK11: "${{ env.JAVA_HOME_11_X64 }}${{ env.JAVA_HOME_11_ARM64 }}"
          BC_JDK17: "${{ env.JAVA_HOME_17_X64 }}${{ env.JAVA_HOME_17_ARM64 }}"
          BC_JDK21: "${{ env.JAVA_HOME_21_X64 }}${{ env.JAVA_HOME_21_ARM64 }}"
          BC_JDK25: "${{ env.JAVA_HOME_25_X64 }}${{ env.JAVA_HOME_25_ARM64 }}"
        run: |
          ./gradlew clean build
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          check_name: |
            ${{ matrix.runner }} - Unit Test
            ${{ matrix.runner }} - Unit Test 8
            ${{ matrix.runner }} - Unit Test 11
            ${{ matrix.runner }} - Unit Test 17
            ${{ matrix.runner }} - Unit Test 21
            ${{ matrix.runner }} - Unit Test 25 FFI
            ${{ matrix.runner }} - Unit Test 25 JNI
            ${{ matrix.runner }} - Integration Test 8
            ${{ matrix.runner }} - Integration Test 11
            ${{ matrix.runner }} - Integration Test 17
            ${{ matrix.runner }} - Integration Test 21
            ${{ matrix.runner }} - Integration Test 25 FFI
            ${{ matrix.runner }} - Integration Test 25 JNI
          report_paths: |
            **/build/test-results/test/TEST-*.xml
            **/build/test-results/unitTest8/TEST-*.xml
            **/build/test-results/unitTest11/TEST-*.xml
            **/build/test-results/unitTest17/TEST-*.xml
            **/build/test-results/unitTest21/TEST-*.xml
            **/build/test-results/unitTest25FFI/TEST-*.xml
            **/build/test-results/unitTest25JNI/TEST-*.xml
            **/build/test-results/integrationTest8/TEST-*.xml
            **/build/test-results/integrationTest11/TEST-*.xml
            **/build/test-results/integrationTest17/TEST-*.xml
            **/build/test-results/integrationTest21/TEST-*.xml
            **/build/test-results/integrationTest25FFI/TEST-*.xml
            **/build/test-results/integrationTest25JNI/TEST-*.xml

  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: ["windows-2025"]
    runs-on: ${{ matrix.runner }}
    env:
      VCVARS: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
    steps:
      - name: "Cache OpenSSL build"
        id: "cache-openssl"
        uses: "actions/cache@v6"
        with:
          path: "openssl/dist"
          key: "openssl-3.6.3-${{ runner.os }}-${{ runner.arch }}"
      - name: "Checkout openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        uses: "actions/checkout@v7"
        with:
          repository: "openssl/openssl"
          ref: "openssl-3.6.3"
          persist-credentials: false
          path: "openssl"
      - name: "Build openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        working-directory: "openssl"
        shell: "cmd"
        run: |
          call "%VCVARS%"
          perl Configure VC-WIN64A --prefix=${{ github.workspace }}\openssl\dist
          nmake
          nmake install_sw
      - name: "Arrange OpenSSL layout for CMake (lib64)"
        # The CMakeLists Windows branch expects the import lib and DLL at
        # ${OPENSSL_PREFIX}/lib64/. A stock `nmake install_sw` puts the import
        # lib in lib\ and the DLL in bin\, so assemble the expected layout
        # explicitly. Fail loudly if either file is missing.
        shell: "pwsh"
        run: |
          $prefix = "${{ github.workspace }}\openssl\dist"
          $lib64  = Join-Path $prefix "lib64"
          New-Item -ItemType Directory -Force -Path $lib64 | Out-Null
          $impLib = Get-ChildItem -Path $prefix -Recurse -Filter "libcrypto.lib" | Select-Object -First 1
          $dll    = Get-ChildItem -Path $prefix -Recurse -Filter "libcrypto-3-x64.dll" | Select-Object -First 1
          if ($null -eq $impLib) { throw "libcrypto.lib not found under $prefix" }
          if ($null -eq $dll)    { throw "libcrypto-3-x64.dll not found under $prefix" }
          Copy-Item $impLib.FullName (Join-Path $lib64 "libcrypto.lib") -Force
          Copy-Item $dll.FullName    (Join-Path $lib64 "libcrypto-3-x64.dll") -Force
          Get-ChildItem $lib64
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '8'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '11'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '17'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '21'
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '25'
      - name: "Set up interface build tools (clang-cl, ninja)"
        shell: "pwsh"
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          choco install ninja -y
      - name: "Check Java version"
        run: |
          java -version
      - name: "Build headers"
        working-directory: "jostle"
        shell: "pwsh"
        run: |
          .\gradlew.bat clean compileJava
      - name: "Build and install the interface"
        working-directory: "jostle"
        shell: "cmd"
        env:
          JOSTLE_OPS_TEST: "true"
          OPENSSL_PREFIX: "${{ github.workspace }}\\openssl\\dist"
        run: |
          call "%VCVARS%"
          call interface\build.bat
      - name: "Build jar"
        working-directory: "jostle"
        shell: "pwsh"
        env:
          BC_JDK8: "${{ env.JAVA_HOME_8_X64 }}"
          BC_JDK11: "${{ env.JAVA_HOME_11_X64 }}"
          BC_JDK17: "${{ env.JAVA_HOME_17_X64 }}"
          BC_JDK21: "${{ env.JAVA_HOME_21_X64 }}"
          BC_JDK25: "${{ env.JAVA_HOME_25_X64 }}"
        run: |
          .\gradlew.bat clean build
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          check_name: |
            ${{ matrix.runner }} - Unit Test
            ${{ matrix.runner }} - Unit Test 8
            ${{ matrix.runner }} - Unit Test 11
            ${{ matrix.runner }} - Unit Test 17
            ${{ matrix.runner }} - Unit Test 21
            ${{ matrix.runner }} - Unit Test 25 FFI
            ${{ matrix.runner }} - Unit Test 25 JNI
            ${{ matrix.runner }} - Integration Test 8
            ${{ matrix.runner }} - Integration Test 11
            ${{ matrix.runner }} - Integration Test 17
            ${{ matrix.runner }} - Integration Test 21
            ${{ matrix.runner }} - Integration Test 25 FFI
            ${{ matrix.runner }} - Integration Test 25 JNI
          report_paths: |
            **/build/test-results/test/TEST-*.xml
            **/build/test-results/unitTest8/TEST-*.xml
            **/build/test-results/unitTest11/TEST-*.xml
            **/build/test-results/unitTest17/TEST-*.xml
            **/build/test-results/unitTest21/TEST-*.xml
            **/build/test-results/unitTest25FFI/TEST-*.xml
            **/build/test-results/unitTest25JNI/TEST-*.xml
            **/build/test-results/integrationTest8/TEST-*.xml
            **/build/test-results/integrationTest11/TEST-*.xml
            **/build/test-results/integrationTest17/TEST-*.xml
            **/build/test-results/integrationTest21/TEST-*.xml
            **/build/test-results/integrationTest25FFI/TEST-*.xml
            **/build/test-results/integrationTest25JNI/TEST-*.xml
