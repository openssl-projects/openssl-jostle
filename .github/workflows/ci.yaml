name: "CI"

on:
  - "pull_request"
  - "push"

permissions:
  contents: "read"
  checks: write
  pull-requests: write

jobs:
  checkstyle:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - name: "Set up Java 25"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "25"
      # Gradle distribution + resolved dependencies. Without this every job in
      # the matrix downloads the Gradle distribution AND resolves the nohttp
      # plugin from Maven Central, and with ~75 jobs that reliably earns an
      # HTTP 429 - which fails the job at CONFIGURATION time, before a single
      # test runs.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Writes. A cache written here is visible to the test jobs in the
          # SAME run (they `needs:` this one), which is what makes this work on
          # a feature branch where no main-branch cache exists yet.
          cache-read-only: false
      - name: "Run Checkstyle"
        working-directory: "jostle"
        # The project scopes the checkstyle gate to the main source set
        # (build.gradle: checkstyle.sourceSets = [main]); this is the same set
        # the old `./gradlew build` -> check ran, plus the nohttp URL check.
        # No native libs / OpenSSL needed — pure source analysis.
        run: |
          ./gradlew :jostle:checkstyleMain :jostle:checkstyleNohttp

  build-posix:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-15"
          - "macos-15-intel"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Cache OpenSSL build"
        id: "cache-openssl"
        uses: "actions/cache@v6"
        with:
          path: "openssl/dist"
          key: "openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}"
      - name: "Checkout openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        uses: "actions/checkout@v7"
        with:
          repository: "openssl/openssl"
          ref: "openssl-3.5.7"
          persist-credentials: false
          path: "openssl"
      - name: "Build openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        working-directory: "openssl"
        run: |
          # -j with NO number means unlimited: make forks every ready target at
          # once, and OpenSSL has thousands. That exhausts the process table on
          # the macOS arm64 runner - "clang: error: unable to execute command:
          # posix_spawn failed: Resource temporarily unavailable". It went
          # unnoticed for a long time because this step is almost always a
          # cache hit. Always bound it.
          #
          # no-tests, as the FIPS builds already use: the interface links
          # against these headers and libs and nothing here runs OpenSSL's own
          # test programs, which are the bulk of the build. install_sw does not
          # install them either, so the cached dist is unchanged and the key
          # needs no bump.
          ./config no-tests --prefix=$(pwd)/dist
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          make install_sw
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '25'
      # See the other jobs: without a Gradle cache every job re-downloads the
      # distribution and re-resolves the nohttp plugin from Maven Central,
      # which earns an HTTP 429 at configuration time.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Writes. A cache written here is visible to the test jobs in the
          # SAME run (they `needs:` this one), which is what makes this work on
          # a feature branch where no main-branch cache exists yet.
          cache-read-only: false
      - name: "Build headers"
        working-directory: "jostle"
        run: |
          ./gradlew clean compileJava
      - name: "Build and install the interface"
        working-directory: "jostle"
        env:
          JOSTLE_OPS_TEST: "true"
          OPENSSL_PREFIX: "${{ github.workspace }}/openssl/dist"
        run: |
          ./interface/build.sh
      - name: "Upload native libraries"
        uses: "actions/upload-artifact@v7"
        with:
          name: "native-${{ matrix.runner }}"
          path: "jostle/jostle/src/main/resources/native"
          if-no-files-found: "error"
          retention-days: 1
      # ----- FIPS modules (both supported versions, enable-fips) -----
      # The interface links against the mainline libcrypto above; at runtime
      # the JSLFIPS provider loads one of THESE modules into its own lib ctx.
      # TEST_FIPS_LIB points the FIPS tests at a module file, with
      # fipsmodule.cnf sitting beside it (see TestUtil.FIPS_LIB_ENV).
      #
      # BOTH are built, and the FIPS test job runs against each in turn.
      # That is not redundancy: JSLFIPS ships ONE build that has to serve two
      # modules which disagree about what they implement, in both directions
      # (X25519, DSA generation and signing, PKCS#1 v1.5 encrypt vs decrypt),
      # so a green run against one proves nothing about the other. The
      # registration probes and the failure classifiers exist precisely to
      # span that gap; testing one module would leave them unverified.
      #
      # 3.1.2 is the CMVP-validated module (cert #4985), usable with libcrypto
      # 3.0-3.5+. The 3.5 FIPS provider is NOT yet validated - 3.5.4 was
      # submitted in Oct 2025 and awaits certificate issuance - but is what a
      # deployment tracking current OpenSSL will have.
      - name: "Cache FIPS modules"
        id: "cache-fips"
        uses: "actions/cache@v6"
        with:
          path: "fips-out"
          # v2 is a LAYOUT version, bumped whenever this step's staged output
          # changes shape - adding the 3.5.7-default directory was such a
          # change. Without it the step is skipped on a hit and the old tree is
          # restored, so a config that was never staged silently goes missing
          # and every FIPS class dies with a bare ProviderException.
          key: "openssl-fips-v2-3.5.7+3.1.2-${{ runner.os }}-${{ runner.arch }}"
      - name: "Build both FIPS modules"
        if: steps.cache-fips.outputs.cache-hit != 'true'
        shell: "bash"
        run: |
          set -eu
          out="${{ github.workspace }}/fips-out"
          # Bounded -j. A bare "make -j" is UNLIMITED: make forks every ready
          # target at once and OpenSSL has thousands, which exhausts the
          # process table on the macOS arm64 runner ("posix_spawn failed:
          # Resource temporarily unavailable"). Building two modules per job
          # made that reliably fatal instead of merely latent.
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          for ver in 3.5.7 3.1.2; do
            src="${{ github.workspace }}/openssl-fips-$ver"
            rm -rf "$src"
            git clone --depth 1 --branch "openssl-$ver" \
              https://github.com/openssl/openssl.git "$src"
            cd "$src"
            # no-tests: we only need libcrypto, the fips module, and openssl(1)
            # for fipsinstall, never OpenSSL's own test programs. Keeps the
            # build short and sidesteps test-source/toolchain incompatibilities
            # (which is why 3.1.2 required it outright).
            ./config enable-fips no-tests --prefix="$src/dist"
            make -j"$jobs"
            make install_sw install_fips
            modfile="$(find "$src/dist" \( -name fips.so -o -name fips.dylib \) | head -1)"
            if [ -z "$modfile" ]; then
              echo "FIPS module not found under $src/dist" >&2
              exit 1
            fi
            mkdir -p "$out/$ver"
            cp "$modfile" "$out/$ver/"
            export LD_LIBRARY_PATH="$src/dist/lib64:$src/dist/lib:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="$src/dist/lib64:$src/dist/lib:${DYLD_LIBRARY_PATH:-}"
            # Regenerate the config beside the copied module: TestUtil expects
            # fipsmodule.cnf to sit next to the module named by TEST_FIPS_LIB,
            # and the MAC covers the file at that path.
            #
            # -pedantic on 3.5.x, plain on 3.1.2, matching the local dev setup.
            # This is NOT cosmetic. Most of the strictness that distinguishes
            # the two modules is a fipsinstall OPTION, not a module property:
            # dsa-sign-disabled, rsa-pkcs15-pad-disabled and hmac-key-check are
            # all off at fipsinstall defaults, and with them off the capability
            # gates this provider added are never exercised at all - CI would
            # be green without running the code under test. 3.1.2 predates most
            # of these switches and is left at its defaults.
            pedantic=""
            case "$ver" in 3.5.*) pedantic="-pedantic" ;; esac
            # shellcheck disable=SC2086
            "$src/dist/bin/openssl" fipsinstall $pedantic \
              -module "$out/$ver/$(basename "$modfile")" \
              -out "$out/$ver/fipsmodule.cnf"
            cat "$out/$ver/fipsmodule.cnf"
            # Third shape, POSIX only and costing no extra OpenSSL build: the
            # SAME 3.5.x module at fipsinstall DEFAULTS. Its own directory
            # because the MAC covers the module at its path, so each config
            # needs its own copy beside it.
            if [ "$ver" != "${ver#3.5.}" ]; then
              mkdir -p "$out/$ver-default"
              cp "$modfile" "$out/$ver-default/"
              "$src/dist/bin/openssl" fipsinstall \
                -module "$out/$ver-default/$(basename "$modfile")" \
                -out "$out/$ver-default/fipsmodule.cnf"
              cat "$out/$ver-default/fipsmodule.cnf"
            fi
            ls -l "$out/$ver"
            cd "${{ github.workspace }}"
            rm -rf "$src"
          done
      - name: "Upload FIPS modules"
        uses: "actions/upload-artifact@v7"
        with:
          name: "fips-module-${{ matrix.runner }}"
          path: "fips-out"
          if-no-files-found: "error"
          retention-days: 1

  test-posix:
    needs: "build-posix"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-15"
          - "macos-15-intel"
        config:
          - { name: "default",   jdk: "25", bcjdk: "",   tasks: "test integrationTest" }
          - { name: "jdk8",      jdk: "8",  bcjdk: "8",  tasks: "unitTest8 integrationTest8" }
          - { name: "jdk11",     jdk: "11", bcjdk: "11", tasks: "unitTest11 integrationTest11" }
          - { name: "jdk17",     jdk: "17", bcjdk: "17", tasks: "unitTest17 integrationTest17" }
          - { name: "jdk21",     jdk: "21", bcjdk: "21", tasks: "unitTest21 integrationTest21" }
          - { name: "jdk25-jni", jdk: "25", bcjdk: "25", tasks: "unitTest25JNI integrationTest25JNI" }
          - { name: "jdk25-ffi", jdk: "25", bcjdk: "25", tasks: "unitTest25FFI integrationTest25FFI" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - name: "Download native libraries"
        uses: "actions/download-artifact@v8"
        with:
          name: "native-${{ matrix.runner }}"
          path: "jostle/jostle/src/main/resources/native"
      - name: "Set up target JDK"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "${{ matrix.config.jdk }}"
      - name: "Set up Java 25 (Gradle runtime)"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "25"
      # Gradle distribution + resolved dependencies. Without this every job in
      # the matrix downloads the Gradle distribution AND resolves the nohttp
      # plugin from Maven Central, and with ~75 jobs that reliably earns an
      # HTTP 429 - which fails the job at CONFIGURATION time, before a single
      # test runs.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Read-only: the build job in this run already seeded it, and matrix
          # jobs writing concurrently just race each other.
          cache-read-only: true
      - name: "Point BC_JDK at the target toolchain"
        if: matrix.config.bcjdk != ''
        shell: "bash"
        env:
          BCJDK: "${{ matrix.config.bcjdk }}"
        run: |
          x64="JAVA_HOME_${BCJDK}_X64"
          arm="JAVA_HOME_${BCJDK}_ARM64"
          echo "BC_JDK${BCJDK}=${!x64:-${!arm}}" >> "$GITHUB_ENV"
      - name: "Run tests"
        working-directory: "jostle"
        env:
          GRADLE_TASKS: "${{ matrix.config.tasks }}"
        run: |
          ./gradlew ${GRADLE_TASKS}
      - name: "Publish Test Report"
        uses: "mikepenz/action-junit-report@v6"
        if: success() || failure() # always run even if the previous step fails
        with:
          check_name: "${{ matrix.runner }} - ${{ matrix.config.name }}"
          report_paths: "**/build/test-results/**/TEST-*.xml"

  test-posix-fips:
    needs: "build-posix"
    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-15"
          - "macos-15-intel"
        config:
          - { name: "fips-jni", tasks: "fipsTest25JNI" }
          - { name: "fips-ffi", tasks: "fipsTest25FFI" }
        # One build, several module CONFIGURATIONS that disagree about what
        # they permit - so each is exercised. See the module-build step in
        # build-posix for why a green run against one proves nothing about
        # another. The Windows FIPS job covers both modules too.
        #
        # "3.5.7" is the -pedantic config; "3.1.2" is that module's default.
        module:
          - "3.5.7"
          - "3.1.2"
        # "3.5.7-default" is the same 3.5.x module at fipsinstall defaults,
        # where dsa-sign-disabled / rsa-pkcs15-pad-disabled / hmac-key-check /
        # signature-digest-check are all 0. That is a legitimate deployment and
        # it is the shape that broke the first CI run, so it is covered - but
        # on one runner only, via include rather than a matrix axis, because
        # the difference is in the module CONFIG and has nothing to do with the
        # platform.
        include:
          - runner: "ubuntu-latest"
            config: { name: "fips-jni", tasks: "fipsTest25JNI" }
            module: "3.5.7-default"
          - runner: "ubuntu-latest"
            config: { name: "fips-ffi", tasks: "fipsTest25FFI" }
            module: "3.5.7-default"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - name: "Download native libraries"
        uses: "actions/download-artifact@v8"
        with:
          name: "native-${{ matrix.runner }}"
          path: "jostle/jostle/src/main/resources/native"
      - name: "Download FIPS module"
        uses: "actions/download-artifact@v8"
        with:
          name: "fips-module-${{ matrix.runner }}"
          path: "fips-module"
      - name: "Set up Java 25"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "25"
      # Gradle distribution + resolved dependencies. Without this every job in
      # the matrix downloads the Gradle distribution AND resolves the nohttp
      # plugin from Maven Central, and with ~75 jobs that reliably earns an
      # HTTP 429 - which fails the job at CONFIGURATION time, before a single
      # test runs.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Read-only: the build job in this run already seeded it, and matrix
          # jobs writing concurrently just race each other.
          cache-read-only: true
      - name: "Point BC_JDK25 and TEST_FIPS_LIB at the toolchain / module"
        shell: "bash"
        run: |
          echo "BC_JDK25=${JAVA_HOME_25_X64:-$JAVA_HOME_25_ARM64}" >> "$GITHUB_ENV"
          case "${{ runner.os }}" in
            Linux) ext=so ;;
            macOS) ext=dylib ;;
            *)     echo "unexpected runner.os ${{ runner.os }}" >&2; exit 1 ;;
          esac
          lib="${{ github.workspace }}/fips-module/${{ matrix.module }}/fips.$ext"
          # Check here rather than letting the provider fail: a missing module
          # surfaces as a bare ProviderException from every FIPS class at once,
          # which says nothing about the cause. Usually a stale module cache -
          # see the layout version in the build job's cache key.
          if [ ! -f "$lib" ]; then
            echo "FIPS module not staged at $lib" >&2
            echo "staged tree:" >&2
            ls -R "${{ github.workspace }}/fips-module" >&2 || true
            exit 1
          fi
          echo "TEST_FIPS_LIB=$lib" >> "$GITHUB_ENV"
      - name: "Run FIPS tests"
        working-directory: "jostle"
        env:
          GRADLE_TASKS: "${{ matrix.config.tasks }}"
        run: |
          # --rerun-tasks: TEST_FIPS_LIB decides which classes run but is not a
          # cacheable Gradle input by default, so force execution rather than
          # risk replaying a wholesale-skipped FIPS run (see testing.md).
          ./gradlew --rerun-tasks ${GRADLE_TASKS}
      - name: "Publish Test Report"
        uses: "mikepenz/action-junit-report@v6"
        if: success() || failure()
        with:
          check_name: "${{ matrix.runner }} - ${{ matrix.config.name }} - module ${{ matrix.module }}"
          report_paths: "**/build/test-results/**/TEST-*.xml"

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        runner: ["windows-2025"]
    runs-on: ${{ matrix.runner }}
    env:
      VCVARS: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
    steps:
      - name: "Cache OpenSSL build"
        id: "cache-openssl"
        uses: "actions/cache@v6"
        with:
          path: "openssl/dist"
          key: "openssl-3.5.7-${{ runner.os }}-${{ runner.arch }}"
      - name: "Checkout openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        uses: "actions/checkout@v7"
        with:
          repository: "openssl/openssl"
          ref: "openssl-3.5.7"
          persist-credentials: false
          path: "openssl"
      - name: "Build openssl"
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        working-directory: "openssl"
        shell: "cmd"
        run: |
          call "%VCVARS%"
          rem no-tests, as the FIPS builds already use: the interface links
          rem against these headers and libs and nothing here runs OpenSSL's
          rem own test programs, which are the bulk of the build. install_sw
          rem does not install them either, so the cached dist is unchanged and
          rem the key needs no bump.
          perl Configure VC-WIN64A no-tests --prefix=${{ github.workspace }}\openssl\dist
          nmake
          nmake install_sw
      - name: "Arrange OpenSSL layout for CMake (lib64)"
        shell: "pwsh"
        run: |
          $prefix = "${{ github.workspace }}\openssl\dist"
          $lib64  = Join-Path $prefix "lib64"
          New-Item -ItemType Directory -Force -Path $lib64 | Out-Null
          $impLib = Get-ChildItem -Path $prefix -Recurse -Filter "libcrypto.lib" | Select-Object -First 1
          $dll    = Get-ChildItem -Path $prefix -Recurse -Filter "libcrypto-3-x64.dll" | Select-Object -First 1
          if ($null -eq $impLib) { throw "libcrypto.lib not found under $prefix" }
          if ($null -eq $dll)    { throw "libcrypto-3-x64.dll not found under $prefix" }
          Copy-Item $impLib.FullName (Join-Path $lib64 "libcrypto.lib") -Force
          Copy-Item $dll.FullName    (Join-Path $lib64 "libcrypto-3-x64.dll") -Force
          Get-ChildItem $lib64
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: '25'
      # See the other jobs: without a Gradle cache every job re-downloads the
      # distribution and re-resolves the nohttp plugin from Maven Central,
      # which earns an HTTP 429 at configuration time.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Writes. A cache written here is visible to the test jobs in the
          # SAME run (they `needs:` this one), which is what makes this work on
          # a feature branch where no main-branch cache exists yet.
          cache-read-only: false
      - name: "Set up interface build tools (clang-cl, ninja)"
        shell: "pwsh"
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          choco install ninja -y
      - name: "Build headers"
        working-directory: "jostle"
        shell: "pwsh"
        run: |
          .\gradlew.bat clean compileJava
      - name: "Build and install the interface"
        working-directory: "jostle"
        shell: "cmd"
        env:
          JOSTLE_OPS_TEST: "true"
          OPENSSL_PREFIX: "${{ github.workspace }}\\openssl\\dist"
        run: |
          call "%VCVARS%"
          call interface\build.bat
      - name: "Upload native libraries"
        uses: "actions/upload-artifact@v7"
        with:
          name: "native-${{ matrix.runner }}"
          path: "jostle/jostle/src/main/resources/native"
          if-no-files-found: "error"
          retention-days: 1
      # ----- FIPS modules (both supported versions, enable-fips) -----
      # Mirrors the POSIX job: JSLFIPS ships ONE build that must serve the
      # CMVP-validated 3.1.2 module (cert #4985) and a 3.5.x one, and they
      # disagree in both directions, so both are built and the FIPS test job
      # runs against each. See build-posix for the full rationale.
      #
      # Cloned rather than checked out per version because a composite action
      # cannot be looped; the cache holds only the staged modules, not the
      # source or dist trees.
      - name: "Cache FIPS modules"
        id: "cache-fips"
        uses: "actions/cache@v6"
        with:
          path: "fips-out"
          # v2 is a LAYOUT version, bumped whenever this step's staged output
          # changes shape - adding the 3.5.7-default directory was such a
          # change. Without it the step is skipped on a hit and the old tree is
          # restored, so a config that was never staged silently goes missing
          # and every FIPS class dies with a bare ProviderException.
          key: "openssl-fips-v2-3.5.7+3.1.2-${{ runner.os }}-${{ runner.arch }}"
      - name: "Build both FIPS modules"
        if: steps.cache-fips.outputs.cache-hit != 'true'
        shell: "cmd"
        run: |
          call "%VCVARS%" || exit /b 1
          rem no-tests: we only need libcrypto, the fips module and openssl.exe
          rem for fipsinstall. Keeps the build short and sidesteps test-source
          rem and toolchain incompatibilities - 3.1.2 requires it outright, its
          rem test\build_wincrypt_test.c using a bare #warning MSVC rejects with
          rem C1188.
          rem
          rem Source dirs are fips-357 / fips-312, NOT openssl-fips-3.5.7:
          rem OpenSSL's build tree is deep and the runner workspace already eats
          rem ~30 chars, so MAX_PATH is a live constraint here. These are shorter
          rem than the single-module build's "openssl-fips" was, so covering two
          rem versions costs no path budget rather than 6 chars each.
          rem
          rem Written out twice rather than looped. A batch for-block is
          rem truncated by the first unescaped ")" in a rem inside it, and
          rem pairing a short dir with a dotted version needs nested for /f
          rem token splitting - neither testable without pushing to CI. Two
          rem plain copies have no such failure mode.
          rmdir /s /q "${{ github.workspace }}\fips-357" 2>nul
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "${{ github.workspace }}\fips-357" || exit /b 1
          pushd "${{ github.workspace }}\fips-357" || exit /b 1
          perl Configure VC-WIN64A enable-fips no-tests --prefix=${{ github.workspace }}\fips-357\dist || exit /b 1
          nmake || exit /b 1
          nmake install_sw install_fips || exit /b 1
          popd

          rmdir /s /q "${{ github.workspace }}\fips-312" 2>nul
          git clone --depth 1 --branch openssl-3.1.2 https://github.com/openssl/openssl.git "${{ github.workspace }}\fips-312" || exit /b 1
          pushd "${{ github.workspace }}\fips-312" || exit /b 1
          perl Configure VC-WIN64A enable-fips no-tests --prefix=${{ github.workspace }}\fips-312\dist || exit /b 1
          nmake || exit /b 1
          nmake install_sw install_fips || exit /b 1
          popd
      - name: "Stage both FIPS modules with their fipsmodule.cnf alongside"
        if: steps.cache-fips.outputs.cache-hit != 'true'
        shell: "pwsh"
        run: |
          $ErrorActionPreference = "Stop"
          # Keyed short-dir -> version; see the build step for why the source
          # trees are not named after the version.
          foreach ($pair in @(@("357", "3.5.7"), @("312", "3.1.2"))) {
            $dir, $ver = $pair
            $prefix = "${{ github.workspace }}\fips-$dir\dist"
            $mod = Get-ChildItem -Path $prefix -Recurse -Filter "fips.dll" | Select-Object -First 1
            if ($null -eq $mod) { throw "FIPS module fips.dll not found under $prefix" }
            $out = "${{ github.workspace }}\fips-out\$ver"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Copy-Item $mod.FullName (Join-Path $out "fips.dll") -Force
            # Regenerate the config beside the copied module, with THAT
            # version's openssl.exe: TestUtil expects fipsmodule.cnf next to
            # the module named by TEST_FIPS_LIB, and the MAC covers the file
            # at that path.
            # -pedantic on 3.5.x, plain on 3.1.2 - see the POSIX build step:
            # dsa-sign-disabled / rsa-pkcs15-pad-disabled / hmac-key-check are
            # fipsinstall OPTIONS, off by default, and without them the
            # capability gates are never exercised.
            #
            # Two plain invocations rather than splatting an argument array:
            # "@pedantic" reached openssl.exe as a bare "-" ("fipsinstall:
            # Unknown option: -"). PowerShell array splatting onto a NATIVE
            # command is not worth reasoning about in a script that can only be
            # tested by pushing to CI.
            $cnf = Join-Path $out "fipsmodule.cnf"
            $dll = Join-Path $out "fips.dll"
            if ($ver -like "3.5.*") {
              & "$prefix\bin\openssl.exe" fipsinstall -pedantic -module $dll -out $cnf
            } else {
              & "$prefix\bin\openssl.exe" fipsinstall -module $dll -out $cnf
            }
            if ($LASTEXITCODE -ne 0) { throw "fipsinstall failed for $ver ($LASTEXITCODE)" }
            Get-Content $cnf
            # The source and dist trees are large and are not cached; only the
            # staged module and its config are.
            Remove-Item -Recurse -Force "${{ github.workspace }}\fips-$dir"
          }
      - name: "Upload FIPS modules"
        uses: "actions/upload-artifact@v7"
        with:
          name: "fips-module-${{ matrix.runner }}"
          path: "fips-out"
          if-no-files-found: "error"
          retention-days: 1

  test-windows:
    needs: "build-windows"
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "default",   jdk: "25", bcjdk: "",   tasks: "test integrationTest" }
          - { name: "jdk8",      jdk: "8",  bcjdk: "8",  tasks: "unitTest8 integrationTest8" }
          - { name: "jdk11",     jdk: "11", bcjdk: "11", tasks: "unitTest11 integrationTest11" }
          - { name: "jdk17",     jdk: "17", bcjdk: "17", tasks: "unitTest17 integrationTest17" }
          - { name: "jdk21",     jdk: "21", bcjdk: "21", tasks: "unitTest21 integrationTest21" }
          - { name: "jdk25-jni", jdk: "25", bcjdk: "25", tasks: "unitTest25JNI integrationTest25JNI" }
          - { name: "jdk25-ffi", jdk: "25", bcjdk: "25", tasks: "unitTest25FFI integrationTest25FFI" }
    runs-on: "windows-2025"
    steps:
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - name: "Download native libraries"
        uses: "actions/download-artifact@v8"
        with:
          name: "native-windows-2025"
          path: "jostle/jostle/src/main/resources/native"
      - name: "Set up target JDK"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "${{ matrix.config.jdk }}"
      - name: "Set up Java 25 (Gradle runtime)"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "25"
      # Gradle distribution + resolved dependencies. Without this every job in
      # the matrix downloads the Gradle distribution AND resolves the nohttp
      # plugin from Maven Central, and with ~75 jobs that reliably earns an
      # HTTP 429 - which fails the job at CONFIGURATION time, before a single
      # test runs.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Read-only: the build job in this run already seeded it, and matrix
          # jobs writing concurrently just race each other.
          cache-read-only: true
      - name: "Point BC_JDK at the target toolchain"
        if: matrix.config.bcjdk != ''
        shell: "bash"
        env:
          BCJDK: "${{ matrix.config.bcjdk }}"
        run: |
          x64="JAVA_HOME_${BCJDK}_X64"
          echo "BC_JDK${BCJDK}=${!x64}" >> "$GITHUB_ENV"
      - name: "Run tests"
        working-directory: "jostle"
        shell: "pwsh"
        env:
          GRADLE_TASKS: "${{ matrix.config.tasks }}"
        run: |
          .\gradlew.bat ($env:GRADLE_TASKS -split ' ')
      - name: "Publish Test Report"
        uses: "mikepenz/action-junit-report@v6"
        if: success() || failure()
        with:
          check_name: "windows-2025 - ${{ matrix.config.name }}"
          report_paths: "**/build/test-results/**/TEST-*.xml"

  test-windows-fips:
    needs: "build-windows"
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "fips-jni", tasks: "fipsTest25JNI" }
          - { name: "fips-ffi", tasks: "fipsTest25FFI" }
        # Both supported modules, as on POSIX. The two disagree about what
        # they implement, so a green run against one proves nothing about the
        # other - see the module-build step in build-posix.
        module:
          - "3.5.7"
          - "3.1.2"
    runs-on: "windows-2025"
    steps:
      - name: "Checkout jostle"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false
          path: "jostle"
      - name: "Download native libraries"
        uses: "actions/download-artifact@v8"
        with:
          name: "native-windows-2025"
          path: "jostle/jostle/src/main/resources/native"
      - name: "Download FIPS module"
        uses: "actions/download-artifact@v8"
        with:
          name: "fips-module-windows-2025"
          path: "fips-module"
      - name: "Set up Java 25"
        uses: "actions/setup-java@v5"
        with:
          distribution: "corretto"
          java-version: "25"
      # Gradle distribution + resolved dependencies. Without this every job in
      # the matrix downloads the Gradle distribution AND resolves the nohttp
      # plugin from Maven Central, and with ~75 jobs that reliably earns an
      # HTTP 429 - which fails the job at CONFIGURATION time, before a single
      # test runs.
      - name: "Cache Gradle"
        uses: "gradle/actions/setup-gradle@v4"
        with:
          # Read-only: the build job in this run already seeded it, and matrix
          # jobs writing concurrently just race each other.
          cache-read-only: true
      - name: "Point BC_JDK25 and TEST_FIPS_LIB at the toolchain / module"
        shell: "bash"
        run: |
          echo "BC_JDK25=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          ws='${{ github.workspace }}'
          ws="${ws//\\//}"
          lib="$ws/fips-module/${{ matrix.module }}/fips.dll"
          if [ ! -f "$lib" ]; then
            echo "FIPS module not staged at $lib" >&2
            ls -R "$ws/fips-module" >&2 || true
            exit 1
          fi
          echo "TEST_FIPS_LIB=$lib" >> "$GITHUB_ENV"
      - name: "Run FIPS tests"
        working-directory: "jostle"
        shell: "pwsh"
        env:
          GRADLE_TASKS: "${{ matrix.config.tasks }}"
        run: |
          # --rerun-tasks: TEST_FIPS_LIB decides which classes run but is not a
          # cacheable Gradle input by default, so force execution (see testing.md).
          .\gradlew.bat --rerun-tasks ($env:GRADLE_TASKS -split ' ')
      - name: "Publish Test Report"
        uses: "mikepenz/action-junit-report@v6"
        if: success() || failure()
        with:
          check_name: "windows-2025 - ${{ matrix.config.name }} - module ${{ matrix.module }}"
          report_paths: "**/build/test-results/**/TEST-*.xml"
