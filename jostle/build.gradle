//
// FIPS-only test stanzas (Java 25). These run ONLY the
// org.openssl.jostle.test.fips.* classes, in isolation from the base suite,
// so the JSLFIPS provider can be exercised on its own. Gated on BC_JDK25 AND
// TEST_FIPS_LIB (the path to the FIPS module library): without the module the
// task is skipped outright rather than running every test as skipped.
//
// The unit stanzas run parallel like unitTest25*; the Limit/Ops/Integration
// stanzas run one fork at a time like integrationTest25*. They are NOT wired
// into `test` (the full unitTest25*/integrationTest25* tasks already include
// the FIPS classes) — use these to run FIPS coverage on demand, e.g.
//   ./gradlew :jostle:fipsTest25JNI
//

tasks.register('fipsUnitTest25FFI', Test) {
    onlyIf { System.getenv("BC_JDK25") != null && System.getenv("TEST_FIPS_LIB") != null }

    dependsOn(jar)
    useJUnitPlatform()

    classpath = files(jar.archiveFile) + sourceSets.test.runtimeClasspath + sourceSets.test25.runtimeClasspath
    testClassesDirs += sourceSets.test25.output.classesDirs
