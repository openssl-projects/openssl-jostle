tasks.withType(Test) {
    testLogging {
        events "passed", "skipped", "failed"
    }
    // TEST_FIPS_LIB gates the FIPS test classes at runtime, but Gradle's
    // up-to-date check hashes declared inputs only — never the environment.
    // Without this property a task last run WITHOUT the module is UP-TO-DATE
    // when re-invoked WITH it set, silently replaying a result in which every
    // FIPS class skipped wholesale (and vice versa). Declaring the variable an
    // input makes toggling it invalidate the task naturally, so --rerun is no
    // longer needed for correctness when the FIPS module comes and goes.
    inputs.property("TEST_FIPS_LIB", providers.environmentVariable("TEST_FIPS_LIB")).optional(true)
}


//
// Coverage (added for ad-hoc coverage runs; the jacoco plugin attaches a
// JacocoTaskExtension to every Test task automatically, so each suite emits
// build/jacoco/<task>.exec). The classDirectories point at a single merged
// directory (build/jacoco-merged-classes) assembled out-of-band so multi-release
// override classes are counted once at the version actually loaded on the test JVM.
//
apply plugin: 'jacoco'
jacoco {
    toolVersion = '0.8.15'
}

tasks.register('coverageReport', JacocoReport) {
    executionData fileTree(layout.buildDirectory).include("jacoco/*.exec")
    classDirectories.from files(layout.buildDirectory.dir("jacoco-merged-classes"))
    sourceDirectories.from files(
            'src/main/java', 'src/main/java9', 'src/main/java11',
            'src/main/java15', 'src/main/java17', 'src/main/java21', 'src/main/java25')
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}
